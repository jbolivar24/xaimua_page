<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xaimua - Login</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">

  <script type="module" src="../js/login.js"></script>
</head>

<body>

<section class="login-section">
  <h2>Iniciar sesión</h2>

  <div class="login-box">
    <label>Correo</label>
    <input type="text" id="username">

    <label>Contraseña</label>
    <input type="password" id="password">

    <button id="loginBtn">Entrar</button>

    <button id="forgotBtn" class="link-button">
      ¿Problemas para iniciar sesión?
    </button>

    <p id="loginMessage"></p>
  </div>
</section>

<!-- ===== MODAL SELECCIÓN ===== -->
<div id="recoverTypeModal" class="modal hidden">
  <div class="modal-box">
    <h3>¿Qué necesitas recuperar?</h3>

    <label><input type="radio" name="recoverType" value="PASSWORD"> Mi contraseña</label>
    <label><input type="radio" name="recoverType" value="EMAIL"> Mi correo</label>
    <label><input type="radio" name="recoverType" value="BOTH"> Correo y contraseña</label>

    <button id="continueRecover">Continuar</button>
    <button id="cancelRecoverType">Cancelar</button>
  </div>
</div>

<!-- ===== MODAL RECUPERAR CONTRASEÑA ===== -->
<div id="recoverPasswordModal" class="modal hidden">
  <div class="modal-box">
    <h3>Recuperar contraseña</h3>

    <label>Correo</label>
    <input type="email" id="recoverEmailInput">

    <button id="confirmRecoverPassword">Continuar</button>
    <button id="cancelRecoverPassword">Cancelar</button>
  </div>
</div>

<!-- ===== MODAL RECUPERAR CORREO / TODO ===== -->
<div id="recoverEmailModal" class="modal hidden">
  <div class="modal-box">
    <h3>Recuperar acceso</h3>

    <label>Nuevo correo</label>
    <input type="email" id="newEmailInput">

    <label>Confirmar correo</label>
    <input type="email" id="confirmNewEmailInput">

    <button id="confirmRecoverEmail">Continuar</button>
    <button id="cancelRecoverEmail">Cancelar</button>
  </div>
</div>

</body>
</html>
