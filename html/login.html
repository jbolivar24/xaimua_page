<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaimua - Login</title>

    <!-- CSS global -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <!-- CSS específico login -->
    <link rel="stylesheet" href="../css/login.css">

    <script src="../js/layout.js" defer></script>
    <script type="module" src="../js/login.js"></script>
</head>
    <body>
        <header id="header"></header>

        <section class="login-section">
            <h2>Iniciar sesión</h2>

            <div class="login-box">

                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario">

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña">

                <button id="loginBtn">Entrar</button>

                <!-- 👇 nuevo -->
                <button id="forgotBtn" class="link-button">
                    ¿Problemas para iniciar sesión?
                </button>

                <p id="loginMessage" class="login-message"></p>
            </div>

            <div id="forgotModal" class="modal hidden">
                <h3>¿Qué necesitas recuperar?</h3>

                <label>
                    <input type="radio" name="recoverType" value="PASSWORD">
                    Mi contraseña
                </label>

                <label>
                    <input type="radio" name="recoverType" value="EMAIL">
                    Mi correo
                </label>

                <label>
                    <input type="radio" name="recoverType" value="BOTH">
                    Correo y contraseña
                </label>

                <button id="continueRecover">Continuar</button>
                <button id="cancelForgot">Cancelar</button>
            </div>

        </section>      

        <footer id="footer"></footer>

        <!-- ===== MODAL RECUPERAR CONTRASEÑA ===== -->
        <div id="forgotModal" class="modal hidden">
            <div class="modal-box">
                <h3>Recuperar contraseña</h3>

                <p>
                    Se enviará un correo a la dirección registrada en el sistema
                    con las instrucciones para crear una nueva contraseña.
                </p>

                <div class="modal-actions">
                    <button id="cancelForgot" class="btn-secondary">Cancelar</button>
                    <button id="confirmForgot" class="btn-primary">Enviar correo</button>
                </div>
            </div>
        </div>

    </body>
</html>
