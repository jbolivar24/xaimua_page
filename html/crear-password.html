<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Xaimua - Crear contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/crear-password.css">

    <!-- Layout -->
    <script src="../js/layout.js" defer></script>

    <!-- JS -->
    <script type="module" src="../js/crear-password.js" defer></script>
</head>

<body>

<header id="header"></header>

<section>
    <div class="form-card">

        <h2>Crear contraseña</h2>
        <p class="muted">Ingresa una nueva contraseña para tu cuenta</p>

        <!-- OJO: form SIN submit automático -->
        <form id="createPasswordForm">

            <div class="form-group">
                <label>Nueva contraseña</label>
                <input type="password" id="newPassword" required>
            </div>

            <div class="form-group">
                <label>Confirmar contraseña</label>
                <input type="password" id="confirmPassword" required>
            </div>

            <!-- CLAVE: type="button" -->
            <button
                id="savePasswordBtn"
                type="button"
                class="primary-btn">
                Guardar contraseña
            </button>

            <p id="msg" class="form-msg"></p>

        </form>

    </div>
</section>

<footer id="footer"></footer>

</body>
</html>
