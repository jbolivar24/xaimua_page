<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaimua - Crear contraseña</title>

    <!-- CSS base -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sections.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <!-- CSS específico -->
    <link rel="stylesheet" href="../css/crear-password.css">

    <!-- Layout dinámico -->
    <script src="../js/layout.js" defer></script>

    <!-- Lógica -->
    <script type="module" src="../js/crear-password.js" defer></script>
</head>

<body>

<header id="header"></header>

<section class="section login-section">
  <h2>Crear contraseña</h2>

  <form id="createPasswordForm" class="login-box">

    <label for="password">Nueva contraseña</label>
    <input
      type="password"
      id="password"
      placeholder="Ingresa tu nueva contraseña"
      required
    >

    <label for="password2">Confirmar contraseña</label>
    <input
      type="password"
      id="password2"
      placeholder="Repite la contraseña"
      required
    >

    <button type="submit" id="createPasswordBtn">
      Guardar contraseña
    </button>

    <p id="msg" class="login-message"></p>

  </form>
</section>

<footer id="footer"></footer>

</body>
</html>
