<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Xaimua · Usuario</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/xaimua_page/img/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="/xaimua_page/img/favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/xaimua_page/img/favicon/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/xaimua_page/img/favicon/apple-touch-icon.png">

    <!-- PWA -->
    <link rel="manifest" href="/xaimua_page/site.webmanifest">

    <!-- Estilos -->
    <link rel="stylesheet" href="/xaimua_page/css/global.css">
    <link rel="stylesheet" href="/xaimua_page/usuario/css/usuario.css">

    <!-- Guard y lógica -->
    <script type="module" src="/xaimua_page/usuario/js/guard-usuario.js"></script>
    <script type="module" src="/xaimua_page/usuario/js/usuario.js"></script>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-inner">
            <div class="header-logo">
                <img src="/xaimua_page/img/logo.png" alt="Xaimua">
            </div>

            <button class="logout-btn" id="logoutHeaderBtn">
                Cerrar sesión
            </button>
        </div>
    </header>

    <!-- ===== CONTENIDO ===== -->
    <main class="usuario-section">
        <div class="usuario-card">
            <h2>Bienvenido</h2>
            <p class="muted">Este es tu panel de usuario</p>

            <div class="info">
                <div>
                    <strong>Usuario:</strong>
                    <span id="userRut">—</span>
                </div>
                <div>
                    <strong>Estado:</strong>
                    <span id="userStatus">Activo</span>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer id="footer"></footer>

</body>
</html>
