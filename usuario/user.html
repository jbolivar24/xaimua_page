<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xaimua · Mi cuenta</title>

  <link rel="icon" type="image/x-icon" href="/xaimua_page/img/favicon/favicon.ico">
  <link rel="manifest" href="/xaimua_page/site.webmanifest">

  <link rel="stylesheet" href="/xaimua_page/css/global.css?v=1">
  <link rel="stylesheet" href="/xaimua_page/usuario/css/user.css?v=2">

  <script type="module" src="/xaimua_page/usuario/js/guard-user.js"></script>
  <script type="module" src="/xaimua_page/usuario/js/user.js"></script>
</head>

<body>

<header class="app-header">
  <div class="header-inner">

    <div class="header-logo">
      <a href="/xaimua_page/index.html">
        <img src="/xaimua_page/img/logo.png" alt="Xaimua">
      </a>
    </div>

    <div class="header-user">
      <span id="userEmail">—</span>
    </div>

    <!-- 🔥 BOTONES UNIFICADOS -->
    <div class="header-actions">
      <button class="logout-btn" id="backBtn">Volver</button>
      <button class="logout-btn" id="logoutHeaderBtn">Cerrar sesión</button>
    </div>

  </div>
</header>

<main class="user-section">

  <section class="panel">

    <div class="panel-block">
      <h3>Mi cuenta</h3>
      <p class="muted">
        Aquí puedes actualizar tus datos de acceso y seguridad.
      </p>
    </div>

    <!-- ===== SEGURIDAD ===== -->
    <div class="panel-block">
      <h3>Seguridad</h3>

      <div class="security-actions">
        <button class="primary-btn" id="openEmailModalBtn">Cambiar correo</button>
        <button class="primary-btn" id="openPassModalBtn">Cambiar contraseña</button>
        <button class="primary-btn" id="openSecurityQModalBtn">Preguntas de seguridad</button>
        <button class="primary-btn" id="openProfileModalBtn">Datos de recuperación</button>
      </div>
    </div>

  </section>

</main>

<footer id="footer"></footer>

</body>
</html>
